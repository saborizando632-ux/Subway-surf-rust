name: Build Web
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          mkdir -p web
          cp target/wasm32-unknown-unknown/release/runner.wasm web/
          curl -L -o web/mq_js_bundle.js https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js
      - name: Criar index.html
        run: |
          cat > web/index.html << 'EOF'
          <html><body style="margin:0;background:#000">
          <canvas id="glcanvas" tabindex="1" style="width:100%;height:100vh"></canvas>
          <script src="mq_js_bundle.js"></script>
          <script>load("runner.wasm");</script>
          </body></html>
          EOF
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
